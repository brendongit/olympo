# Deploy no Render — plano gratuito (Seção 17.7 da spec).
#
# Sem banco de dados algum — as salas vivem em memória no processo do
# servidor (decisão 1: sem Redis, sem Postgres).
#
# Depois do primeiro deploy do olympos-web, preencha ORIGEM_PERMITIDA abaixo
# com a URL gerada pro olympos-web (ex.: https://olympos-web.onrender.com) e
# VITE_SERVIDOR_URL com a URL do olympos-servidor
# (https://olympos-servidor.onrender.com). VITE_SERVIDOR_URL é lida em tempo
# de BUILD pelo Vite — mudar seu valor exige um novo deploy do static site,
# não só um restart.

services:
  - type: web
    name: olympos-servidor
    runtime: node
    plan: free
    region: oregon
    buildCommand: pnpm install --frozen-lockfile
    startCommand: pnpm --filter @olympos/servidor start
    healthCheckPath: /health
    envVars:
      - key: ORIGEM_PERMITIDA
        sync: false # preencha com a origem que vai consumir o servidor (ver README de deploy)

  - type: web
    name: olympos-web
    runtime: static
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @olympos/web build
    staticPublishPath: packages/web/dist
    envVars:
      - key: VITE_SERVIDOR_URL
        sync: false # ex.: https://olympos-servidor.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
